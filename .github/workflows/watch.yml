name: 霜ばしら 監視

on:
  # 定期的に監視を開始する（GitHub の cron は最短 5 分間隔・遅延あり）
  schedule:
    - cron: "*/5 * * * *"
  # 手動実行（告知された開始時刻を狙い撃つとき / すぐ試したいとき）
  workflow_dispatch:
    inputs:
      max_seconds:
        description: "1 回の実行で監視し続ける秒数（既定 420。cron 間隔 300 秒より長くして隙間をなくす）"
        required: false
        default: "420"
      interval_seconds:
        description: "通常時の監視間隔（秒）"
        required: false
        default: "20"
      fast_interval_seconds:
        description: "受付開始ウィンドウ中の監視間隔（秒）"
        required: false
        default: "2"
      start_at:
        description: "販売開始予定時刻 (JST, 例: 2026-11-20T19:00:00)。空なら自動アーミング／通常監視"
        required: false
        default: ""
      lead_minutes:
        description: "start_at の何分前から高速監視を始めるか"
        required: false
        default: "10"
      mode:
        description: "continuous=常時監視 / window=開始ウィンドウの前は1周だけ確認して終了（省エネ）"
        required: false
        default: "continuous"
      x_interval_seconds:
        description: "X の新着チェック間隔（秒）"
        required: false
        default: "900"
      timeout_minutes:
        description: "ジョブのタイムアウト（分）。max_seconds より大きくすること（最大 360）"
        required: false
        default: "20"

# 実行を直列化する（同時実行による二重通知と state.json の競合を防ぐ）
concurrency:
  group: tamazawa-watch
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ fromJSON(github.event.inputs.timeout_minutes || '20') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 監視を実行
        env:
          PYTHONIOENCODING: utf-8
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          MAX_SECONDS: ${{ github.event.inputs.max_seconds || '420' }}
          INTERVAL_SECONDS: ${{ github.event.inputs.interval_seconds || '20' }}
          FAST_INTERVAL_SECONDS: ${{ github.event.inputs.fast_interval_seconds || '2' }}
          LEAD_MINUTES: ${{ github.event.inputs.lead_minutes || '10' }}
          START_AT: ${{ github.event.inputs.start_at }}
          MODE: ${{ github.event.inputs.mode || 'continuous' }}
          X_INTERVAL_SECONDS: ${{ github.event.inputs.x_interval_seconds || '900' }}
        run: python monitor.py

      - name: state.json をコミット（内容が変化したときだけ）
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- state.json
          if git diff --cached --quiet -- state.json; then
            echo "state.json に変化なし。コミットしません。"
            exit 0
          fi
          git pull --rebase --autostash || true
          git commit -m "chore: update watch state [skip ci]"
          git push
